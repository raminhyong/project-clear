<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLEAR Space — โฟลเดอร์ผลงานและคลังอีบุ๊ก 3D | Project CLEAR</title>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .space-banner {
      width: 100%; min-height: 180px; border-radius: var(--radius-lg, 16px);
      background: linear-gradient(180deg, rgba(6, 30, 23, 0.35) 0%, rgba(13, 51, 40, 0.92) 100%);
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 1.6rem 1.9rem; color: #fff; margin-bottom: 1.75rem;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.22);
      border: 1px solid rgba(16, 185, 129, 0.25);
      position: relative; overflow: hidden;
    }
    .space-banner::before {
      content: ''; position: absolute; top: -60px; right: -40px; width: 220px; height: 220px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.28) 0%, transparent 70%); pointer-events: none;
    }

    .guard-card { max-width: 520px; margin: 3rem auto; text-align: center; padding: 2.5rem 2rem; }
    .guard-icon {
      width: 68px; height: 68px; border-radius: 20px; margin: 0 auto 1.25rem;
      display: grid; place-items: center; font-size: 1.8rem; color: #fff;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      box-shadow: 0 10px 26px -8px rgba(245, 158, 11, 0.6);
    }

    .space-breadcrumb {
      display: inline-flex; align-items: center; gap: 0.45rem; font-size: 0.88rem; font-weight: 600;
      color: var(--text-muted); background: var(--surface-glass); border: 1px solid var(--border-subtle);
      padding: 0.45rem 0.9rem; border-radius: 999px; cursor: pointer; margin-bottom: 1.25rem;
      transition: all 0.2s ease;
    }
    .space-breadcrumb:hover { color: var(--brand-blue); border-color: var(--brand-blue); }

    .hub-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.25rem; }
    .folder-card {
      display: flex; flex-direction: column; gap: 0.9rem; padding: 1.4rem;
      border-radius: var(--radius-lg, 16px); background: var(--surface-glass);
      border: 1px solid var(--border-glass); box-shadow: var(--shadow-md);
      cursor: pointer; text-align: left; font-family: var(--font-thai);
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
      position: relative; overflow: hidden;
    }
    .folder-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: rgba(16, 185, 129, 0.4); }
    .folder-icon {
      width: 52px; height: 52px; border-radius: 15px; display: grid; place-items: center;
      font-size: 1.4rem; color: #fff; box-shadow: 0 8px 18px -6px rgba(0, 0, 0, 0.4);
    }
    .folder-type-badge {
      display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.22rem 0.65rem;
      border-radius: 999px; font-size: 0.72rem; font-weight: 700;
      background: var(--brand-emerald-light); color: var(--brand-emerald); width: fit-content;
    }
    .folder-meta { display: flex; gap: 1rem; font-size: 0.82rem; color: var(--text-muted); }

    .board-toolbar {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
      gap: 0.9rem; margin-bottom: 1.35rem;
    }
    .card-size-controls {
      display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.3rem;
      border-radius: 999px; background: var(--surface-card); border: 1px solid var(--border-subtle);
    }
    .card-size-controls span.size-label { font-size: 0.78rem; color: var(--text-muted); padding: 0 0.5rem; }
    .size-btn {
      border: none; background: transparent; padding: 0.4rem 0.8rem; border-radius: 999px;
      font-family: var(--font-thai); font-size: 0.8rem; font-weight: 600; color: var(--text-muted);
      cursor: pointer; transition: all 0.18s ease; display: inline-flex; align-items: center; gap: 0.3rem;
    }
    .size-btn.active { background: var(--brand-emerald); color: #fff; box-shadow: 0 3px 10px rgba(16,185,129,0.35); }

    .post-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px; align-items: start; margin-bottom: 3rem;
    }
    .post-grid.size-compact { grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); }
    .post-grid.size-normal  { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    .post-grid.size-large   { grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); }

    .space-post-card {
      background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: 14px;
      overflow: hidden; box-shadow: var(--shadow-sm); padding: 12px;
      display: flex; flex-direction: column; gap: 9px;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }
    .space-post-card:hover { transform: translateY(-4px); box-shadow: 0 14px 28px rgba(0, 0, 0, 0.2); border-color: var(--brand-emerald); }
    .post-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .post-author { font-size: 0.82rem; font-weight: 700; }
    .teacher-badge {
      display: inline-flex; align-items: center; gap: 3px; font-size: 0.66rem; font-weight: 700;
      padding: 1px 7px; border-radius: 999px; background: linear-gradient(135deg, #10b981, #f59e0b);
      color: #fff; margin-left: 4px;
    }
    .post-time { font-size: 0.72rem; color: var(--text-dim); white-space: nowrap; }

    .post-image { width: 100%; border-radius: 10px; display: block; object-fit: cover; aspect-ratio: 4 / 3; background: #0f172a; }
    .post-link {
      display: block; font-size: 0.82rem; color: var(--brand-blue); font-weight: 600;
      word-break: break-all; background: var(--brand-blue-light); padding: 0.6rem 0.75rem; border-radius: 10px;
    }

    .book-cover {
      position: relative; display: block; width: 100%; padding: 0; border: 0; border-radius: 8px;
      overflow: hidden; cursor: pointer; background: #0f172a; aspect-ratio: 210 / 297; text-align: left;
    }
    .book-cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s cubic-bezier(0.2,0,0,1); }
    .space-post-card:hover .book-cover img { transform: scale(1.03); }
    .book-cover-hint {
      position: absolute; left: 6px; bottom: 6px; padding: 3px 8px; background: rgba(0,0,0,0.72);
      backdrop-filter: blur(5px); border-radius: 999px; color: #fff; font-size: 0.72rem; font-weight: 700;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.12); pointer-events: none;
    }
    .card-title { font-size: 0.9rem; font-weight: 700; line-height: 1.3; margin: 0; color: var(--text-main); }
    .card-excerpt {
      font-size: 0.76rem; line-height: 1.4; color: var(--text-muted); margin: 0;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap;
    }

    .reactions-bar { display: flex; gap: 4px; flex-wrap: wrap; }
    .reaction-btn {
      display: inline-flex; align-items: center; gap: 4px; padding: 0.28rem 0.6rem; border-radius: 999px;
      border: 1px solid var(--border-subtle); background: var(--surface-card); font-size: 0.82rem;
      font-family: var(--font-thai); cursor: pointer; transition: all 0.18s ease; color: var(--text-muted);
    }
    .reaction-btn:hover { border-color: var(--brand-emerald); transform: translateY(-1px); }
    .reaction-btn.active { background: var(--brand-emerald-light); border-color: var(--brand-emerald); color: var(--brand-emerald); font-weight: 700; }
    .reaction-btn .rcount { font-size: 0.74rem; font-weight: 700; }

    .card-footer-row {
      display: flex; justify-content: space-between; align-items: center;
      padding-top: 8px; border-top: 1px solid var(--border-subtle); gap: 8px; flex-wrap: wrap;
    }
    .comment-toggle, .read-now-btn {
      background: none; border: none; padding: 0; cursor: pointer; font-family: var(--font-thai);
      font-size: 0.78rem; font-weight: 700; color: var(--brand-emerald);
      display: inline-flex; align-items: center; gap: 5px;
    }
    .comment-toggle:hover, .read-now-btn:hover { text-decoration: underline; }

    .comments-section {
      max-height: 0; overflow: hidden; opacity: 0;
      transition: max-height 0.35s ease, opacity 0.3s ease, margin-top 0.3s ease, padding-left 0.3s ease;
      border-left: 2px solid var(--border-subtle); padding-left: 0; margin-top: 0;
    }
    .comments-section.open { max-height: 1100px; opacity: 1; padding-left: 12px; margin-top: 6px; }
    .comment-item { display: flex; flex-direction: column; gap: 2px; margin-bottom: 10px; }
    .comment-item .comment-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .comment-author { font-size: 0.8rem; font-weight: 700; }
    .comment-text { font-size: 0.8rem; color: var(--text-main); white-space: pre-wrap; margin: 0; }
    .comment-img { max-width: 180px; border-radius: 8px; display: block; margin-top: 3px; }
    .comment-time { font-size: 0.7rem; color: var(--text-dim); }
    .comment-delete { background: none; border: none; color: var(--brand-rose); font-size: 0.72rem; cursor: pointer; font-weight: 700; }
    .comment-empty { font-size: 0.78rem; color: var(--text-dim); margin: 0 0 8px; }
    .comment-form { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
    .comment-form input[type="text"] {
      flex: 1; min-width: 0; padding: 0.45rem 0.7rem; font-size: 0.8rem; border-radius: 999px;
      border: 1px solid var(--border-subtle); background: var(--surface-card); color: var(--text-main); outline: none;
    }
    .comment-form input[type="text"]:focus { border-color: var(--brand-emerald); }
    .comment-attach {
      cursor: pointer; width: 34px; height: 34px; border-radius: 999px; display: grid; place-items: center;
      background: var(--brand-blue-light); color: var(--brand-blue); flex-shrink: 0;
    }
    .comment-send {
      border: none; border-radius: 999px; padding: 0.45rem 0.9rem; background: var(--brand-emerald);
      color: #fff; font-family: var(--font-thai); font-weight: 700; font-size: 0.78rem; cursor: pointer; flex-shrink: 0;
    }

    .space-post-card.card-pink { background: #fdf2f8; border-color: #fbcfe8; }
    .space-post-card.card-blue { background: #eff6ff; border-color: #bfdbfe; }
    .space-post-card.card-green { background: #ecfdf5; border-color: #a7f3d0; }
    .space-post-card.card-yellow { background: #fefce8; border-color: #fef08a; }
    .space-post-card.card-purple { background: #faf5ff; border-color: #e9d5ff; }
    .space-post-card[class*="card-"] .card-title,
    .space-post-card[class*="card-"] .post-author,
    .space-post-card[class*="card-"] .comment-text { color: #0f172a; }
    .space-post-card[class*="card-"] .card-excerpt,
    .space-post-card[class*="card-"] .post-time,
    .space-post-card[class*="card-"] .comment-time { color: #475569; }

    .reader-backdrop {
      position: fixed; inset: 0; background: rgba(6, 12, 20, 0.95); backdrop-filter: blur(16px);
      z-index: 2500; display: none; flex-direction: column; align-items: center; justify-content: center;
      padding: 12px; box-sizing: border-box; opacity: 0; transition: opacity 0.3s ease;
    }
    .reader-backdrop.open { display: flex; opacity: 1; }
    .reader-topbar {
      width: 100%; max-width: 920px; display: flex; justify-content: space-between; align-items: center;
      color: #fff; padding: 6px 12px 10px; z-index: 20;
    }
    .reader-topbar-title {
      font-size: 1rem; font-weight: 700; display: flex; align-items: center; gap: 8px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .reader-close-round {
      width: 38px; height: 38px; border-radius: 999px; flex-shrink: 0;
      background: rgba(255,255,255,0.14); color: #fff; border: 1px solid rgba(255,255,255,0.18);
      display: grid; place-items: center; cursor: pointer; font-size: 1.15rem; transition: all 0.2s ease;
    }
    .reader-close-round:hover { background: var(--brand-rose, #f43f5e); transform: scale(1.06); }

    .book-viewer-stage-frame {
      position: relative; width: 100%; max-width: 420px; height: min(65vh, 600px); aspect-ratio: 210 / 297;
      margin: 0 auto; padding: 24px; box-sizing: border-box;
      background: radial-gradient(circle at 50% 30%, #174e3f 0%, #0d3328 60%, #061e17 100%);
      border-radius: 18px; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75), inset 0 0 0 1px rgba(255,255,255,0.12);
      display: flex; align-items: center; justify-content: center;
    }
    .book-viewer-stage-frame.spread { max-width: 880px; height: min(74vh, 620px); aspect-ratio: 420 / 297; padding: 14px; overflow: hidden; }
    .book-viewer-stage { position: absolute; inset: 24px; display: flex; align-items: center; justify-content: center; }
    .book-viewer-stage-frame.spread .book-viewer-stage { inset: 14px; }
    .book-viewer-spine {
      position: absolute; top: 14px; bottom: 14px; left: 50%; width: 68px; transform: translateX(-50%);
      background: linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,0.22) 42%, rgba(0,0,0,0.5) 50%, rgba(0,0,0,0.22) 58%, rgba(0,0,0,0) 100%);
      pointer-events: none; z-index: 15;
    }
    .book-viewer-loading {
      position: absolute; inset: 14px; margin: 0; display: grid; place-items: center;
      background: rgba(0,0,0,0.45); border-radius: 10px; color: #fff; font-size: 0.95rem; z-index: 20;
    }
    .book-swipe-hint {
      position: absolute; right: 22px; bottom: 30%; z-index: 20; pointer-events: none;
      display: flex; flex-direction: column; align-items: center; gap: 5px; color: #fff;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.7)); animation: swipeHandAnim 1.6s ease-in-out infinite; transition: opacity 0.5s ease;
    }
    .book-swipe-hint.fade-out { opacity: 0; }
    .book-swipe-hint svg { width: 38px; height: 38px; fill: #fff; stroke: #0d3328; stroke-width: 1.5; }
    .book-swipe-hint span {
      font-size: 0.72rem; font-weight: 600; background: rgba(0,0,0,0.65); padding: 3px 10px;
      border-radius: 999px; backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.15);
    }
    @keyframes swipeHandAnim {
      0%, 100% { transform: translateX(0) rotate(0deg); opacity: 0.9; }
      50% { transform: translateX(-28px) rotate(-15deg); opacity: 1; }
    }
    .book-viewer-controls {
      margin-top: 14px; display: flex; align-items: center; gap: 12px; padding: 7px 14px;
      border-radius: 999px; background: rgba(20, 30, 24, 0.85); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.16); color: #fff; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 25;
    }
    .book-viewer-controls button {
      width: 38px; height: 38px; min-height: 38px; padding: 0; border-radius: 999px;
      background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.1);
      display: grid; place-items: center; cursor: pointer; transition: all 0.2s ease; font-size: 1.15rem;
    }
    .book-viewer-controls button:hover:not(:disabled) { background: var(--brand-emerald, #10b981); transform: scale(1.06); }
    .book-viewer-controls button:disabled { opacity: 0.35; cursor: not-allowed; }
    .book-viewer-page-count { font-size: 0.86rem; color: #fff; font-weight: 700; min-width: 80px; text-align: center; }
    .reader-backdrop:fullscreen {
      background: radial-gradient(circle at 50% 30%, #174e3f 0%, #0d3328 60%, #061e17 100%);
      width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px;
    }
    .reader-backdrop:fullscreen .book-viewer-stage-frame.spread { height: min(84vh, 760px); max-width: 1120px; }

    .empty-state { text-align: center; padding: 3rem 1.5rem; color: var(--text-muted); }
    .empty-state i { font-size: 2.5rem; color: var(--text-dim); margin-bottom: 1rem; display: block; }
  </style>
</head>
<body>
  <div class="ambient-glow ambient-1"></div>
  <div class="ambient-glow ambient-2"></div>

  <header class="clear-navbar">
    <div class="clear-nav-inner">
      <div class="brand-badge">
        <a href="#" onclick="goHome(); return false;" style="display: flex; align-items: center; gap: 0.75rem; text-decoration: none;">
          <div class="brand-logo-icon" style="background: linear-gradient(135deg, #10b981, #059669);"><i class="fa-solid fa-book-open"></i></div>
          <span>CLEAR Space</span>
        </a>
      </div>
      <nav class="nav-links">
        <button class="nav-btn" onclick="goHome()" title="กลับหน้าคะแนนของฉัน">
          <i class="fa-solid fa-house nav-btn-icon"></i> <span>หน้าหลัก</span>
        </button>
        <button class="nav-btn" onclick="logoutStudent()" title="ออกจากระบบ" style="color: var(--brand-rose);">
          <i class="fa-solid fa-arrow-right-from-bracket nav-btn-icon"></i> <span>ออกจากระบบ</span>
        </button>
        <button id="themeToggleBtn" class="nav-btn" title="สลับโหมด"><i id="themeIcon" class="fa-solid fa-moon"></i></button>
      </nav>
    </div>
  </header>

  <main class="clear-container">
    <div id="spaceRoot"><!-- Injected: guard / hub / board view --></div>
  </main>

  <!-- AnyFlip Real 3D Book Viewer (clean chrome: round X top-right + one bottom capsule) -->
  <div id="anyFlipReader" class="reader-backdrop" role="dialog" aria-modal="true">
    <div class="reader-topbar">
      <div class="reader-topbar-title">
        <i class="fa-solid fa-book-open" style="color: var(--brand-emerald, #10b981);"></i>
        <span id="readerBookTitle">ชื่อหนังสือ</span>
      </div>
      <button type="button" class="reader-close-round" onclick="closeReader()" aria-label="ปิด" title="ปิด">✕</button>
    </div>

    <div class="book-viewer-stage-frame spread" id="stageFrame">
      <div class="book-viewer-stage" id="flipContainer"></div>
      <div class="book-viewer-spine" id="spineShadow" aria-hidden="true"></div>
      <div class="book-viewer-loading" id="readerLoading" style="display: none;">
        <span><i class="fa-solid fa-spinner fa-spin"></i> กำลังโหลดหน้าเล่ม...</span>
      </div>
      <div class="book-swipe-hint" id="swipeHint" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M9 11V6a2 2 0 0 1 4 0v5m0-3a2 2 0 0 1 4 0v3m0-2a2 2 0 0 1 4 0v6a7 7 0 0 1-7 7H12a7 7 0 0 1-5.6-2.8L4.3 14.8a1.5 1.5 0 0 1 2.3-1.9L9 15" fill="currentColor" /></svg>
        <span>ปัดเพื่อเปิดอ่าน</span>
      </div>
    </div>

    <div class="book-viewer-controls" id="readerControls">
      <button type="button" id="prevPageBtn" onclick="flipPrev()" aria-label="หน้าก่อนหน้า" title="หน้าก่อนหน้า">‹</button>
      <span class="book-viewer-page-count" id="readerPageCounter">หน้า 1 / 8</span>
      <button type="button" id="nextPageBtn" onclick="flipNext()" aria-label="หน้าถัดไป" title="หน้าถัดไป">›</button>
      <button type="button" onclick="toggleReaderFullscreen()" id="ctrlFsBtn" aria-label="อ่านเต็มจอ" title="อ่านเต็มจอ">
        <i class="fa-solid fa-expand" style="font-size: 0.95rem;"></i>
      </button>
      <button type="button" onclick="closeReader()" aria-label="ปิด" title="ปิด" style="font-size: 0.95rem;">✕</button>
    </div>
  </div>

  <!-- Compose work modal (adapts to board type) -->
  <div id="composeModal" class="clear-modal-backdrop">
    <div class="clear-modal-content" style="max-width: 540px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
        <h3 id="composeTitle" style="font-size: 1.2rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; margin: 0;">
          <i class="fa-solid fa-circle-plus" style="color: var(--brand-emerald, #10b981);"></i> เพิ่มผลงานใหม่
        </h3>
        <button onclick="closeComposeModal()" style="background: none; border: none; font-size: 1.3rem; cursor: pointer; color: var(--text-dim);">&times;</button>
      </div>

      <form id="composeForm" onsubmit="handleComposeSubmit(event)" autocomplete="off">
        <div class="clear-input-group">
          <label class="clear-label" for="workTopic">หัวข้อผลงาน</label>
          <input type="text" id="workTopic" class="clear-input" placeholder="เช่น ภาพวาดสัตว์เลี้ยงของฉัน" maxlength="200" required>
        </div>

        <div class="clear-input-group" id="workAuthorGroup">
          <label class="clear-label" for="workAuthor">ผู้จัดทำ</label>
          <input type="text" id="workAuthor" class="clear-input" placeholder="ชื่อ-สกุล / กลุ่ม">
        </div>

        <div id="blogComposeFields">
          <div class="clear-input-group">
            <label class="clear-label">ประเภทผลงาน</label>
            <div style="display: flex; gap: 0.6rem;">
              <button type="button" id="workTypeImageBtn" class="clear-btn clear-btn-primary" style="flex:1;" onclick="setWorkType('image')">🖼️ ภาพ</button>
              <button type="button" id="workTypeLinkBtn" class="clear-btn clear-btn-secondary" style="flex:1;" onclick="setWorkType('link')">🔗 ลิงก์</button>
            </div>
          </div>
          <div class="clear-input-group" id="singleImageGroup">
            <label class="clear-label" for="workImage">แนบภาพผลงาน</label>
            <input type="file" id="workImage" class="clear-input" accept="image/*">
          </div>
          <div class="clear-input-group" id="linkGroup" style="display:none;">
            <label class="clear-label" for="workLink">ลิงก์ผลงาน (Canva / Google Docs / Padlet / YouTube)</label>
            <input type="url" id="workLink" class="clear-input" placeholder="https://...">
          </div>
        </div>

        <div id="bookComposeFields" style="display:none;">
          <div class="clear-input-group">
            <label class="clear-label" for="workBookPages">แนบภาพหน้าหนังสือ (หลายภาพตามลำดับ · สูงสุด 15 หน้า)</label>
            <input type="file" id="workBookPages" class="clear-input" accept="image/*" multiple>
            <small style="color: var(--text-muted); font-size: 0.75rem; margin-top: 4px; display: block;">* หากไม่แนบไฟล์ ระบบจะสร้างหน้าหนังสือ A4 จำลองให้อัตโนมัติ</small>
          </div>
        </div>

        <div class="clear-input-group">
          <label class="clear-label" for="workDesc">คำอธิบายผลงาน</label>
          <textarea id="workDesc" class="clear-input" rows="2" placeholder="เล่าเกี่ยวกับผลงานชิ้นนี้สั้น ๆ" required></textarea>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
          <button type="button" onclick="closeComposeModal()" class="clear-btn clear-btn-secondary">ยกเลิก</button>
          <button type="submit" class="clear-btn clear-btn-primary" style="background: linear-gradient(135deg, #10b981, #047857);">
            <span>บันทึกผลงาน</span>
          </button>
        </div>
      </form>
