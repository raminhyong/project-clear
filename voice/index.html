<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLEAR Voice — เสียงสะท้อนผู้เรียน | Project CLEAR</title>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background: radial-gradient(circle at 50% -10%, rgba(139,92,246,0.14), transparent 60%), var(--bg-primary); }
    #voiceRoot { max-width: 720px; margin: 0 auto; }

    .voice-hero { text-align: center; margin-bottom: 1.75rem; }
    .voice-card { padding: 1.75rem; }
    .voice-progress { display: flex; gap: 0.4rem; margin-bottom: 1.5rem; }
    .voice-progress .seg { flex: 1; height: 7px; border-radius: 999px; background: var(--border-subtle); overflow: hidden; }
    .voice-progress .seg.done { background: linear-gradient(90deg, #8b5cf6, #7c3aed); }
    .voice-progress .seg.active { background: linear-gradient(90deg, #a78bfa, #8b5cf6); box-shadow: 0 0 0 2px rgba(139,92,246,0.25); }

    .voice-step-title { font-size: 1.3rem; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.35rem; }
    .voice-step-title i { color: #8b5cf6; }
    .voice-step-sub { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
    .voice-q { margin-bottom: 1.6rem; }
    .voice-q-label { font-weight: 700; font-size: 1.02rem; margin-bottom: 0.75rem; line-height: 1.5; }
    .voice-q-req { color: #f43f5e; margin-left: 0.2rem; }

    .emoji-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.5rem; }
    .emoji-btn {
      display: flex; flex-direction: column; align-items: center; gap: 0.35rem; padding: 0.7rem 0.3rem;
      border-radius: 14px; border: 1.5px solid var(--border-subtle); background: var(--surface-card);
      cursor: pointer; font-family: var(--font-thai); transition: all 0.18s ease;
    }
    .emoji-btn .emoji { font-size: 1.7rem; line-height: 1; transition: transform 0.18s ease; }
    .emoji-btn .emoji-label { font-size: 0.68rem; color: var(--text-muted); font-weight: 600; text-align: center; line-height: 1.1; }
    .emoji-btn:hover { border-color: #8b5cf6; transform: translateY(-2px); }
    .emoji-btn.selected { border-color: #8b5cf6; background: rgba(139,92,246,0.12); box-shadow: 0 6px 16px -6px rgba(139,92,246,0.6); }
    .emoji-btn.selected .emoji { transform: scale(1.15); }

    .scale-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.45rem; }
    .scale-btn {
      padding: 0.6rem 0.25rem; border-radius: 12px; border: 1.5px solid var(--border-subtle);
      background: var(--surface-card); cursor: pointer; font-family: var(--font-thai);
      display: flex; flex-direction: column; align-items: center; gap: 0.2rem; transition: all 0.18s ease;
    }
    .scale-btn .num { font-weight: 800; font-size: 1rem; }
    .scale-btn .cap { font-size: 0.62rem; color: var(--text-muted); text-align: center; line-height: 1.05; }
    .scale-btn:hover { border-color: #8b5cf6; }
    .scale-btn.selected { border-color: #8b5cf6; background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: #fff; }
    .scale-btn.selected .cap { color: rgba(255,255,255,0.85); }
    .scale-hint { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--text-dim); margin-top: 0.35rem; }

    .chip-wrap { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .chip {
      padding: 0.5rem 0.9rem; border-radius: 999px; border: 1.5px solid var(--border-subtle);
      background: var(--surface-card); cursor: pointer; font-family: var(--font-thai);
      font-size: 0.88rem; font-weight: 600; transition: all 0.16s ease;
    }
    .chip:hover { border-color: #8b5cf6; }
    .chip.selected { background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: #fff; border-color: transparent; box-shadow: 0 5px 14px -6px rgba(139,92,246,0.7); }
    .chip-limit { font-size: 0.74rem; color: var(--text-dim); margin-top: 0.4rem; }

    .voice-textarea { width: 100%; min-height: 84px; }

    .voice-nav { display: flex; justify-content: space-between; gap: 0.75rem; margin-top: 1.75rem; }
    .voice-nav .clear-btn { flex: 1; }

    .voice-code-box { text-align: center; }
    .voice-thanks { text-align: center; padding: 2.5rem 1.5rem; }
    .voice-thanks .heart { font-size: 3rem; margin-bottom: 0.75rem; animation: heartBeat 1.4s ease-in-out infinite; }
    @keyframes heartBeat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  </style>
</head>
<body>
  <div class="ambient-glow ambient-1"></div>
  <div class="ambient-glow ambient-2"></div>

  <header class="clear-navbar">
    <div class="clear-nav-inner">
      <div class="brand-badge">
        <div style="display: flex; align-items: center; gap: 0.75rem;">
          <div class="brand-logo-icon" style="background: linear-gradient(135deg, #8b5cf6, #7c3aed);"><i class="fa-solid fa-comment-dots"></i></div>
          <span>CLEAR Voice</span>
        </div>
      </div>
      <nav class="nav-links">
        <button type="button" class="nav-btn" onclick="returnToScores()" title="กลับหน้าคะแนนของฉัน">
          <i class="fa-solid fa-house nav-btn-icon"></i> <span>หน้าหลัก</span>
        </button>
        <button id="themeToggleBtn" class="nav-btn" title="สลับโหมด" onclick="toggleTheme()"><i id="themeIcon" class="fa-solid fa-moon"></i></button>
      </nav>
    </div>
  </header>

  <main class="clear-container">
    <div id="voiceRoot">
      <div class="voice-hero">
        <span class="clear-badge badge-metallic" style="margin-bottom: 0.5rem;"><i class="fa-solid fa-shield-heart"></i> CLEAR Voice · ประเมินอย่างโปร่งใส</span>
        <h1 style="font-size: 1.85rem; font-weight: 800; color: var(--text-main);">CLEAR Voice</h1>
        <p style="color: var(--text-muted); font-size: 0.95rem;">เสียงสะท้อนของคุณมีค่า ช่วยให้ห้องเรียนของเราดีขึ้นทุกวัน</p>
      </div>
      <div id="voiceBody">
        <div class="clear-card voice-card" style="text-align:center; padding:3rem;">
          <i class="fa-solid fa-circle-notch fa-spin" style="font-size:2rem; color:#8b5cf6;"></i>
          <p style="color:var(--text-muted); margin-top:0.75rem;">กำลังโหลดแบบประเมิน...</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="clear-footer">
    <p>© 2026 Project CLEAR — รายวิชาภาษาไทย ครูรามิล ปัญญพัทธ์</p>
  </footer>

  <script src="../assets/js/shared.js"></script>
  <script src="voice-engine.js"></script>
</body>
</html>
