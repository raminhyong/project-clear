<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLEAR Prep — คลังข้อสอบและแบบฝึกหัด | Project CLEAR</title>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    #prepRoot { --prep-accent: #f59e0b; --prep-accent-2: #d97706; --prep-soft: rgba(245,158,11,0.12); }
    #prepRoot[data-exam="final"] { --prep-accent: #6366f1; --prep-accent-2: #4f46e5; --prep-soft: rgba(99,102,241,0.12); }

    /* ── Catalog ── */
    .prep-catalog-hero { text-align: center; margin-bottom: 2rem; }
    .prep-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem; max-width: 940px; margin: 0 auto; }
    .prep-card {
      display: flex; flex-direction: column; width: 100%; text-align: left; padding: 0;
      border-radius: 20px; overflow: hidden; cursor: pointer; background: var(--surface-card);
      border: 1px solid var(--border-glass); box-shadow: var(--shadow-md);
      font-family: var(--font-thai); color: var(--text-main);
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }
    .prep-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-lg); border-color: var(--prep-accent); }
    .prep-card-head {
      position: relative; min-height: 118px; display: flex; align-items: flex-start; justify-content: space-between;
      padding: 1.25rem 1.35rem; color: #fff; overflow: hidden;
    }
    .prep-card-head > i { font-size: 2.6rem; opacity: 0.95; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.28)); }
    .prep-card-head::after {
      content: ''; position: absolute; top: -60%; left: -70%; width: 45%; height: 220%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.42), transparent);
      transform: rotate(24deg); animation: metallicShine 5s cubic-bezier(0.4,0,0.2,1) infinite;
    }
    .prep-badges { display: flex; flex-direction: column; gap: 0.4rem; align-items: flex-end; }
    .prep-badges .badge-metallic { font-size: 0.7rem; background: rgba(0,0,0,0.22); border-color: rgba(255,255,255,0.45); }
    .prep-card-body { padding: 1.35rem; display: flex; flex-direction: column; gap: 0.75rem; flex: 1; }
    .prep-card-body h3 { font-size: 1.22rem; font-weight: 800; margin: 0; }
    .prep-card-body p { font-size: 0.88rem; color: var(--text-muted); margin: 0; line-height: 1.6; flex: 1; }
    .prep-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      padding: 0.8rem 1rem; border-radius: 12px; color: #fff; font-weight: 700; font-size: 0.95rem;
      box-shadow: 0 6px 16px var(--prep-soft);
    }

    /* ── Test head / tabs ── */
    .prep-test-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
    .prep-back {
      display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.55rem 1rem; border-radius: 999px;
      border: 1px solid var(--border-subtle); background: var(--surface-card); color: var(--text-muted);
      font-family: var(--font-thai); font-weight: 600; font-size: 0.88rem; cursor: pointer;
    }
    .prep-back:hover { border-color: var(--prep-accent); color: var(--prep-accent); }
    .prep-test-title { font-size: 1.1rem; font-weight: 800; color: var(--prep-accent); }
    .prep-progress { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
    .subset-tabs { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
    .subset-tab {
      padding: 0.55rem 1rem; border-radius: 999px; border: 1px solid var(--border-subtle);
      background: var(--surface-card); font-family: var(--font-thai); font-weight: 600; font-size: 0.85rem;
      color: var(--text-muted); cursor: pointer; transition: all 0.2s ease;
    }
    .subset-tab:hover { border-color: var(--prep-accent); }
    .subset-tab.active { background: linear-gradient(135deg, var(--prep-accent), var(--prep-accent-2)); color: #fff; border-color: transparent; box-shadow: 0 4px 14px var(--prep-soft); }

    /* ── Question navigator pills ── */
    .qnav-grid { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.35rem; }
    .qnav-pill {
      width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border-subtle);
      background: var(--surface-card); color: var(--text-muted); font-weight: 700; font-size: 0.82rem;
      cursor: pointer; transition: all 0.18s ease; font-family: var(--font-thai);
    }
    .qnav-pill.answered { background: #dcfce7; border-color: #86efac; color: #166534; }
    .qnav-pill.current { background: linear-gradient(135deg, var(--prep-accent), var(--prep-accent-2)); border-color: transparent; color: #fff; box-shadow: 0 4px 12px var(--prep-soft); }

    /* ── Question card ── */
    .qcard { padding: 1.75rem; max-width: 900px; margin: 0 auto; }
    .qcard-meta { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.1rem; }
    .qmeta-chip { font-size: 0.74rem; font-weight: 700; padding: 0.28rem 0.7rem; border-radius: 999px; background: var(--prep-soft); color: var(--prep-accent-2); }
    #prepRoot[data-exam="final"] .qmeta-chip { color: var(--prep-accent); }
    .verse-quote {
      border-left: 5px solid var(--prep-accent); background: var(--surface-glass);
      padding: 1rem 1.25rem; border-radius: 0 12px 12px 0; margin-bottom: 1.25rem;
      font-family: 'Noto Serif Thai', 'Sarabun', serif; font-size: 1.02rem; line-height: 1.95;
      white-space: pre-wrap; color: var(--text-main);
    }
    .qtext { font-size: 1.15rem; font-weight: 700; line-height: 1.65; margin-bottom: 1.35rem; white-space: pre-wrap; }
    .q-opts { display: flex; flex-direction: column; gap: 0.7rem; margin-bottom: 1.25rem; }
    .option-btn {
      display: flex; align-items: flex-start; gap: 0.75rem; width: 100%; text-align: left;
      padding: 0.9rem 1.1rem; border-radius: 12px; border: 1.5px solid var(--border-subtle);
      background: var(--surface-card); color: var(--text-main); font-family: var(--font-thai);
      font-size: 0.98rem; line-height: 1.55; cursor: pointer; transition: all 0.18s ease;
    }
    .option-btn:hover:not(:disabled) { border-color: var(--prep-accent); transform: translateX(3px); }
    .option-btn .opt-num {
      flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
      background: var(--prep-soft); color: var(--prep-accent-2); font-weight: 800; font-size: 0.85rem;
    }
    #prepRoot[data-exam="final"] .option-btn .opt-num { color: var(--prep-accent); }
    .option-btn.selected { border-color: var(--prep-accent); background: var(--prep-soft); }
    .option-btn.correct { border-color: #10b981; background: #dcfce7; color: #065f46; }
    .option-btn.correct .opt-num { background: #10b981; color: #fff; }
    .option-btn.wrong { border-color: #ef4444; background: #fee2e2; color: #991b1b; }
    .option-btn.wrong .opt-num { background: #ef4444; color: #fff; }
    .option-btn:disabled { cursor: default; opacity: 0.95; }

    .qfeedback { display: none; padding: 1rem 1.15rem; border-radius: 12px; margin-bottom: 1.25rem; font-size: 0.95rem; line-height: 1.7; }
    .qfeedback.show { display: block; }
    .qfeedback.ok { background: #dcfce7; border: 1px solid #86efac; color: #065f46; }
    .qfeedback.no { background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; }
    .qfeedback strong { display: block; margin-bottom: 0.35rem; }

    .qcard-controls { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; flex-wrap: wrap; border-top: 1px solid var(--border-subtle); padding-top: 1.25rem; }
    .prep-submit { text-align: center; margin: 1.75rem 0 2.5rem; }

    /* ── Result stage ── */
    .result-stage { max-width: 560px; margin: 1.5rem auto; text-align: center; }
    .score-circle { position: relative; width: 190px; height: 190px; margin: 0 auto 1.25rem; }
    .score-circle svg { transform: rotate(-90deg); }
    .score-circle .track { fill: none; stroke: var(--border-subtle); stroke-width: 14; }
    .score-circle .meter { fill: none; stroke: url(#scoreGrad); stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset 0.9s cubic-bezier(0.2,0,0,1); }
    .score-inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .score-inner .score-num { font-size: 3rem; font-weight: 800; color: var(--prep-accent); line-height: 1; }
    .score-inner small { font-size: 0.95rem; color: var(--text-muted); }
    .result-level { font-size: 1.35rem; font-weight: 800; margin-bottom: 0.35rem; }
    .result-sub { color: var(--text-muted); font-size: 0.92rem; margin-bottom: 1.75rem; }
    .result-actions { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="ambient-glow ambient-1"></div>
  <div class="ambient-glow ambient-2"></div>

  <header class="clear-navbar">
    <div class="clear-nav-inner">
      <div class="brand-badge">
        <div style="display: flex; align-items: center; gap: 0.75rem;">
          <div class="brand-logo-icon" style="background: linear-gradient(135deg, #f59e0b, #d97706);"><i class="fa-solid fa-file-pen"></i></div>
          <span>CLEAR Prep</span>
        </div>
      </div>
      <nav class="nav-links">
        <button type="button" class="nav-btn" onclick="returnToScores()" title="กลับหน้าคะแนนของฉัน">
          <i class="fa-solid fa-house nav-btn-icon"></i> <span>หน้าหลัก</span>
        </button>
        <button id="themeToggleBtn" class="nav-btn" title="สลับโหมด" onclick="toggleTheme()"><i id="themeIcon" class="fa-solid fa-moon"></i></button>
      </nav>
    </div>
  </header>

  <main class="clear-container">
    <div id="prepRoot"></div>
  </main>

  <footer class="clear-footer">
    <p>© 2026 Project CLEAR — รายวิชาภาษาไทย ครูรามิล ปัญญพัทธ์</p>
  </footer>

  <script src="../assets/js/shared.js"></script>
  <script src="exam-data.js"></script>
  <script src="exam-engine.js"></script>
</body>
</html>
