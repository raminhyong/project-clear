<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLEAR Point — ระบบสะสมแต้มและคูปอง | Project CLEAR</title>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    .scanner-box {
      width: 100%; max-width: 380px; height: 280px; margin: 0 auto 1.25rem;
      border-radius: var(--radius-md); overflow: hidden; position: relative;
      background: #000; display: none;
    }
    .scanner-video { width: 100%; height: 100%; object-fit: cover; }
    .scanner-laser {
      position: absolute; top: 50%; left: 10%; right: 10%; height: 2px;
      background: var(--brand-emerald); box-shadow: 0 0 12px var(--brand-emerald);
      animation: laserScan 2s ease-in-out infinite alternate;
    }
    @keyframes laserScan { 0% { top: 15%; } 100% { top: 85%; } }

    .code-hint {
      text-align: left; font-size: 0.8rem; font-weight: 700; margin-top: -0.6rem; margin-bottom: 1rem;
      min-height: 1.1em; color: var(--text-muted);
    }
    .code-hint.task { color: #10b981; }
    .code-hint.pum { color: #d97706; }
    .code-hint.bad { color: var(--brand-rose); }

    .claim-result {
      display: none; margin-top: 1.5rem; padding: 1.4rem; border-radius: var(--radius-lg);
      text-align: left; border: 1px solid var(--border-subtle); background: var(--surface-card);
      animation: claimRise 0.35s cubic-bezier(0.2,0,0,1) both;
    }
    .claim-result.show { display: block; }
    @keyframes claimRise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    .claim-result.pum { border-color: rgba(245,158,11,0.5); background: linear-gradient(135deg, rgba(245,158,11,0.1), rgba(217,119,6,0.05)); }
    .claim-result.task { border-color: rgba(16,185,129,0.5); background: linear-gradient(135deg, rgba(16,185,129,0.1), rgba(5,150,105,0.05)); }
    .claim-result.error { border-color: rgba(244,63,94,0.5); background: linear-gradient(135deg, rgba(244,63,94,0.1), rgba(225,29,72,0.05)); }
    .cr-head { display: flex; gap: 0.9rem; align-items: flex-start; }
    .cr-icon {
      width: 52px; height: 52px; flex: none; border-radius: 16px; display: grid; place-items: center;
      font-size: 1.5rem; color: #fff;
    }
    .claim-result.pum .cr-icon { background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 8px 20px -6px rgba(245,158,11,0.7); }
    .claim-result.task .cr-icon { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 8px 20px -6px rgba(16,185,129,0.7); }
    .claim-result.error .cr-icon { background: linear-gradient(135deg, #f43f5e, #e11d48); box-shadow: 0 8px 20px -6px rgba(244,63,94,0.7); }
    .cr-title { font-size: 1.1rem; font-weight: 800; }
    .cr-big { font-size: 1.7rem; font-weight: 800; margin: 0.2rem 0; }
    .claim-result.pum .cr-big { color: #d97706; }
    .claim-result.task .cr-big { color: #059669; }
    .cr-sub { font-size: 0.88rem; color: var(--text-muted); line-height: 1.6; }
    .cr-actions { display: flex; gap: 0.6rem; margin-top: 1.1rem; flex-wrap: wrap; }
    .cr-actions .clear-btn { flex: 1; min-width: 140px; }
  </style>
</head>
<body>
  <div class="ambient-glow ambient-1"></div>
  <div class="ambient-glow ambient-2"></div>

  <header class="clear-navbar">
    <div class="clear-nav-inner">
      <div class="brand-badge">
        <div style="display: flex; align-items: center; gap: 0.75rem;">
          <div class="brand-logo-icon" style="background: linear-gradient(135deg, #10b981, #0ea5e9);"><i class="fa-solid fa-gem"></i></div>
          <span>CLEAR Point</span>
        </div>
      </div>
      <nav class="nav-links">
        <button type="button" class="nav-btn" onclick="returnToScores()" title="กลับหน้าคะแนนของฉัน">
          <i class="fa-solid fa-house nav-btn-icon"></i> <span>หน้าหลัก</span>
        </button>
        <button id="themeToggleBtn" class="nav-btn" title="สลับโหมด" onclick="toggleTheme()"><i id="themeIcon" class="fa-solid fa-moon"></i></button>
      </nav>
    </div>
  </header>

  <main class="clear-container">
    <div style="max-width: 520px; margin: 1rem auto 0; text-align: center;">
      <span class="clear-badge badge-metallic" style="margin-bottom: 0.5rem;"><i class="fa-solid fa-qrcode"></i> CLEAR Point · รับแต้มด้วยตนเอง</span>
      <h1 style="font-size: 1.85rem; font-weight: 800; margin-bottom: 0.35rem;">CLEAR Point</h1>
      <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.75rem;">สแกน QR Code หรือกรอกรหัสคูปอง ระบบจะตรวจประเภทและบันทึกแต้มให้อัตโนมัติ</p>

      <div class="clear-card card-metallic" style="padding: 2rem;">
        <div id="scannerArea" class="scanner-box">
          <video id="videoFeed" class="scanner-video" playsinline></video>
          <div class="scanner-laser"></div>
        </div>

        <div style="margin-bottom: 1.25rem;">
          <button id="cameraToggleBtn" onclick="toggleCamera()" class="clear-btn clear-btn-secondary" style="width: 100%; margin-bottom: 1rem;">
            <i class="fa-solid fa-camera"></i> <span id="cameraBtnText">เปิดกล้องสแกน QR Code</span>
          </button>
        </div>

        <form onsubmit="handleClaimCode(event)" autocomplete="off">
          <div class="clear-input-group">
            <label class="clear-label" for="claimCode">รหัสคูปอง / โค้ดปั๊ม</label>
            <input type="text" id="claimCode" class="clear-input" placeholder="เช่น T01-AB12-CD34 หรือ P5-WXYZ"
              style="text-align: center; font-size: 1.25rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;"
              oninput="onCodeInput()" required autofocus>
          </div>
          <div id="codeHint" class="code-hint"></div>

          <div class="clear-input-group">
            <label class="clear-label" for="claimStudentCode">รหัสประจำตัวนักเรียน (5 หลัก)</label>
            <input type="text" id="claimStudentCode" class="clear-input" placeholder="เช่น 24252" maxlength="5" inputmode="numeric" pattern="\d{5}" style="text-align: center;" required>
          </div>

          <button type="submit" id="submitClaimBtn" class="clear-btn clear-btn-primary btn-metallic shimmer-manifest" style="width: 100%; padding: 0.85rem; font-size: 1rem;">
            <i class="fa-solid fa-check-to-slot"></i> <span>ตรวจสอบและรับคะแนน</span>
          </button>
        </form>

        <div id="claimResult" class="claim-result"></div>
      </div>
    </div>
  </main>

  <footer class="clear-footer">
    <p>© 2026 Project CLEAR — รายวิชาภาษาไทย ครูรามิล ปัญญพัทธ์</p>
  </footer>

  <script src="../assets/js/shared.js"></script>
  <script>
    let scanning = false;
    let videoStream = null;
    let lastClaim = null;

    function esc(v) {
      return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    /* ── Prefill student code from ?code= or the logged-in room session ── */
    (function prefillStudent() {
      const input = document.getElementById('claimStudentCode');
      if (!input) return;
      const fromUrl = (new URLSearchParams(window.location.search).get('code') || '').replace(/\D/g, '').slice(0, 5);
      if (fromUrl.length === 5) { input.value = fromUrl; return; }
      try {
        for (let i = 0; i < sessionStorage.length; i++) {
          const k = sessionStorage.key(i);
          const m = k && k.match(/^clear_auth_student_(.+)$/);
          if (m) {
            const s = JSON.parse(sessionStorage.getItem(k) || 'null');
            const code = (s && s.code ? String(s.code) : '').replace(/\D/g, '').slice(0, 5);
            if (code.length === 5) { input.value = code; return; }
          }
        }
      } catch (e) {}
    })();

    /* ── Auto-detect hint ── */
    function detectType(code) {
      const c = String(code || '').trim().toUpperCase();
      if (c.startsWith('T')) return 'task';
      if (c.startsWith('P')) return 'pum';
      return '';
    }
    function onCodeInput() {
      const input = document.getElementById('claimCode');
      input.value = input.value.toUpperCase().replace(/[^A-Z0-9-]/g, '');
      const hint = document.getElementById('codeHint');
      const t = detectType(input.value);
      if (!input.value) { hint.className = 'code-hint'; hint.textContent = ''; }
      else if (t === 'task') { hint.className = 'code-hint task'; hint.textContent = '🔎 ตรวจพบ: คูปองคะแนนงาน (Task Coupon)'; }
      else if (t === 'pum') { hint.className = 'code-hint pum'; hint.textContent = '🔎 ตรวจพบ: แต้มปั๊ม (PUM Code)'; }
      else { hint.className = 'code-hint bad'; hint.textContent = '⚠️ รหัสต้องขึ้นต้นด้วย T (คะแนนงาน) หรือ P (แต้มปั๊ม)'; }
    }

    function setResult(html, cls) {
      const box = document.getElementById('claimResult');
      box.className = 'claim-result show ' + (cls || '');
      box.innerHTML = html;
    }

    /* ── Claim flow: lookupCode -> redeem / redeemPum ── */
    async function handleClaimCode(e) {
      if (e) e.preventDefault();
      const codeInput = document.getElementById('claimCode');
      const studentInput = document.getElementById('claimStudentCode');
      const btn = document.getElementById('submitClaimBtn');
      const code = codeInput.value.trim().toUpperCase();
      const studentCode = studentInput.value.trim();

      if (!code) { showToast('กรุณากรอกรหัสคูปอง', 'warning'); return; }
      if (!/^\d{5}$/.test(studentCode)) { showToast('กรุณากรอกรหัสนักเรียน 5 หลัก', 'warning'); return; }
      if (!detectType(code)) { showToast('รหัสต้องขึ้นต้นด้วย T หรือ P', 'warning'); return; }

      btn.disabled = true;
      const original = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังตรวจสอบ...';

      try {
        const lookup = await fetchClearApi('lookupCode', { code }, false);
        if (!lookup || !lookup.ok) throw new Error((lookup && lookup.error) || 'รหัสไม่ถูกต้องหรือถูกใช้งานไปแล้ว');

        if (lookup.type === 'pum') {
          const res = await fetchClearApi('redeemPum', { pumCode: code, studentCode }, false);
          if (!res || !res.ok) throw new Error((res && res.error) || 'ไม่สามารถรับแต้มปั๊มได้');
          lastClaim = { kind: 'pum', code };
          renderPumResult(res);
          showToast('รับแต้มปั๊มสำเร็จ!', 'success');
        } else if (lookup.type === 'task') {
          const res = await fetchClearApi('redeem', { couponCode: code, studentCode, room: lookup.room }, false);
          if (!res || !res.ok) throw new Error((res && res.error) || 'ไม่สามารถรับคะแนนงานได้');
          lastClaim = { kind: 'task', code };
          renderTaskResult(res);
          showToast('บันทึกคะแนนงานสำเร็จ!', 'success');
        } else {
          throw new Error('ไม่รู้จักประเภทของรหัสนี้');
        }
        codeInput.value = '';
        onCodeInput();
      } catch (err) {
        setResult(`
          <div class="cr-head">
            <div class="cr-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
            <div>
              <div class="cr-title">ไม่สามารถรับคะแนนได้</div>
              <div class="cr-sub">${esc(err.message)}</div>
            </div>
          </div>`, 'error');
        showToast(err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = original;
      }
    }

    function renderPumResult(res) {
      const value = Number(res.value || 0);
      const label = res.categoryLabel ? `คุณลักษณะ: ${esc(res.categoryLabel)}` : '';
      setResult(`
        <div class="cr-head">
          <div class="cr-icon"><i class="fa-solid fa-stamp"></i></div>
          <div style="flex:1;">
            <div class="cr-title">🎉 รับแต้มปั๊มสำเร็จ!</div>
            <div class="cr-big">+${value} PUM</div>
            ${label ? `<div class="cr-sub">${label} (+${value} PUM)</div>` : ''}
            <div class="cr-sub">นักเรียน ${esc(res.studentName || '')} · ห้อง ${esc(res.studentRoom || '')}</div>
          </div>
        </div>
        <div class="cr-actions">
          <button type="button" class="clear-btn clear-btn-amber" onclick="resetForNext()"><i class="fa-solid fa-ticket"></i> <span>รับอีกใบ 🎟️</span></button>
          <button type="button" class="clear-btn clear-btn-secondary" onclick="returnToScores()"><i class="fa-solid fa-chart-simple"></i> <span>ดูคะแนนของฉัน</span></button>
        </div>`, 'pum');
    }

    function renderTaskResult(res) {
      const score = Number(res.score || 0);
      const taskIndex = Number(res.taskIndex || 0);
      setResult(`
        <div class="cr-head">
          <div class="cr-icon"><i class="fa-solid fa-circle-check"></i></div>
          <div style="flex:1;">
            <div class="cr-title">🎉 บันทึกคะแนนงานสำเร็จ!</div>
            <div class="cr-big">+${score} คะแนน</div>
            <div class="cr-sub">งานที่ ${taskIndex + 1}: ${esc(res.taskLabel || '')} · ห้อง ${esc(res.room || '')}</div>
            <div class="cr-sub">นักเรียน ${esc(res.studentName || '')}</div>
          </div>
        </div>
        <div class="cr-actions">
          <button type="button" class="clear-btn clear-btn-emerald" onclick="resetForNext()"><i class="fa-solid fa-ticket"></i> <span>รับอีกใบ 🎟️</span></button>
          <button type="button" class="clear-btn clear-btn-secondary" onclick="returnToScores()"><i class="fa-solid fa-chart-simple"></i> <span>ดูคะแนนของฉัน</span></button>
        </div>`, 'task');
    }

    function resetForNext() {
      const box = document.getElementById('claimResult');
      box.className = 'claim-result';
      box.innerHTML = '';
      const codeInput = document.getElementById('claimCode');
      codeInput.value = '';
      onCodeInput();
      codeInput.focus();
      if (!scanning) showToast('พร้อมรับใบถัดไป กรอกหรือสแกนรหัสได้เลย', 'info');
    }

    /* ── Camera QR scanning (jsQR) ── */
    async function toggleCamera() {
      const scanner = document.getElementById('scannerArea');
      const video = document.getElementById('videoFeed');
      const btnText = document.getElementById('cameraBtnText');

      if (scanning) {
        stopCamera();
        return;
      }
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        video.srcObject = videoStream;
        video.setAttribute('playsinline', true);
        await video.play();
        scanner.style.display = 'block';
        btnText.textContent = 'ปิดกล้องสแกน';
        scanning = true;
        requestAnimationFrame(tickScan);
      } catch (err) {
        showToast('ไม่สามารถเข้าถึงกล้องได้: ' + err.message, 'error');
      }
    }

    function stopCamera() {
      if (videoStream) videoStream.getTracks().forEach(t => t.stop());
      videoStream = null;
      const scanner = document.getElementById('scannerArea');
      if (scanner) scanner.style.display = 'none';
      const btnText = document.getElementById('cameraBtnText');
      if (btnText) btnText.textContent = 'เปิดกล้องสแกน QR Code';
      scanning = false;
    }

    function extractCode(text) {
      let code = String(text || '').trim();
      try {
        const u = new URL(code);
        const fromQuery = u.searchParams.get('code');
        if (fromQuery) code = fromQuery;
      } catch (e) {}
      return code.toUpperCase().replace(/[^A-Z0-9-]/g, '');
    }

    function tickScan() {
      if (!scanning) return;
      const video = document.getElementById('videoFeed');
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const result = jsQR(imgData.data, imgData.width, imgData.height);
        if (result && result.data) {
          const code = extractCode(result.data);
          document.getElementById('claimCode').value = code;
          onCodeInput();
          stopCamera();
          showToast('สแกน QR Code สำเร็จ!', 'success');
          handleClaimCode();
          return;
        }
      }
      requestAnimationFrame(tickScan);
    }
  </script>
</body>
</html>
